<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="positionfixed.css">
</head>
<body>
    <h1>Using Position Fixed</h1>
    <p>An element with position: fixed; 
        is positioned relative to the viewport, which means 
        it always stays in the same place even if the page is scrolled:</p>
    <div class="fixed">
        This div element has a Position Fixed
    </div>
    
</body>
